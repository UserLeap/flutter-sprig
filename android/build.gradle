group = "com.sprig.sprig_flutter_plugin"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.0"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.2.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        
        if (project.hasProperty('useLocalUserleap') && project.property('useLocalUserleap') == 'true') {
            flatDir {
                dirs file("${projectDir}/../../../android/userleap/build/outputs/aar")
            }
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.sprig.sprig_flutter_plugin"
    compileSdk = 36
    
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }
    
    defaultConfig {
        minSdk = 24
    }
    
    testOptions {
        unitTests.all {
            useJUnitPlatform()
            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

dependencies {
    // Kotlin standard library
    implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version")
    
    if (project.hasProperty('useLocalUserleap') && project.property('useLocalUserleap') == 'true') {
        implementation(name: 'userleap-debug', ext: 'aar')
        
        // Add userleap's transitive dependencies when using local AAR
        implementation "androidx.appcompat:appcompat:1.4.2"
        implementation "androidx.webkit:webkit:1.8.0"
        implementation "com.google.android.material:material:1.6.1"
        implementation "androidx.core:core-ktx:1.3.0"
        implementation "androidx.work:work-runtime-ktx:2.9.0"
        implementation "com.squareup.okhttp3:okhttp:4.12.0"
        implementation "com.google.code.gson:gson:2.10.1"
        implementation "androidx.lifecycle:lifecycle-process:2.6.2"
        implementation "androidx.lifecycle:lifecycle-common:2.6.2"
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.4"
        implementation "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.6.4"
    } else {
        implementation "com.userleap:userleap-android-sdk:2.29.0"
    }
    
    // Test dependencies
    testImplementation("org.jetbrains.kotlin:kotlin-test")
    testImplementation("org.mockito:mockito-core:5.0.0")
}
