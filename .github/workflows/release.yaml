name: Main Flutter Release
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
jobs:
  make-release:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Version
        id: get-version
        run: echo "version=$(grep -o "[0-9]\+\.[0-9]\+\.[0-9]\+" ios/sprig_flutter_plugin.podspec)" >> $GITHUB_OUTPUT

      #- name: Create Tag
      #  run: bash ./scripts/tag-and-release.sh tag ${{ secrets.GITHUB_TOKEN }} ${{ steps.get-version.outputs.version }}
