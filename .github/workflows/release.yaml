name: Main Flutter Release
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
jobs:
  make-release:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Get Version
        id: get-version
        run: echo "version=$(grep -o "[0-9]\+\.[0-9]\+\.[0-9]\+" ../ios/sprig_flutter_plugin.podspec)" >> $GITHUB_OUTPUT

      - name: Create or update tag
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ steps.get-version.outputs.version }}
          message: "Release ${{ steps.get-version.outputs.version }}" # Optional: A message for the tag
          github_token: ${{ secrets.GITHUB_TOKEN }} # Required for authentication
